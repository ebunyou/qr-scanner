<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QRコードスキャナー</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 20px;
      background: white;
    }

    #status {
      margin: 20px auto;
      padding: 15px;
      max-width: 500px;
      background: white;
      border-radius: 8px;
      word-break: break-all;
    }

    button {
      font-size: 18px;
      padding: 12px 24px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #4285f4;
      color: white;
    }

    button:disabled {
      background: #aaa;
    }
  </style>
</head>

<body>

  <h1>QRコードスキャナー</h1>

  <div id="reader"></div>

  <div id="status">
    QRコードをカメラに映してください。
  </div>

  <button id="restartButton" style="display:none;">
    もう一度スキャン
  </button>


  <script>

    /*
     * ==========================================
     * Googleフォーム設定
     * ==========================================
     */

    const FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSei4G1ALsbPRFIn7pJ_Y-SvFpi03s0WuMHT4eT8_aIWSuLhZg/viewform";

    const FORM_ENTRY =
      "entry.2044249571";


    /*
     * ==========================================
     * QRスキャナー
     * ==========================================
     */

    let html5QrCode = null;
    let scanning = false;
    let alreadyScanned = false;


    const statusElement =
      document.getElementById("status");

    const restartButton =
      document.getElementById("restartButton");


    function setStatus(message) {
      statusElement.textContent = message;
    }


    function startScanner() {

      alreadyScanned = false;

      restartButton.style.display = "none";

      setStatus(
        "QRコードをカメラに映してください。"
      );


      html5QrCode =
        new Html5Qrcode("reader");


      html5QrCode.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        onScanSuccess,

        onScanFailure

      ).then(function() {

        scanning = true;

      }).catch(function(error) {

        console.error(error);

        setStatus(
          "カメラを起動できませんでした。カメラの使用を許可してください。"
        );

      });

    }


    function onScanFailure(error) {
      // QRが見つからない場合は何もしない
    }


    async function onScanSuccess(decodedText) {

      if (alreadyScanned) {
        return;
      }

      alreadyScanned = true;

      console.log(
        "QRコード:",
        decodedText
      );


      /*
       * カメラを停止
       */

      if (
        html5QrCode &&
        scanning
      ) {

        try {

          await html5QrCode.stop();

          scanning = false;

        } catch (error) {

          console.error(
            "カメラ停止エラー:",
            error
          );

        }

      }


      /*
       * Googleフォームの事前入力URLを作成
       */

      const formUrl =
        FORM_URL +
        "?usp=pp_url&" +
        FORM_ENTRY +
        "=" +
        encodeURIComponent(decodedText);


      console.log(
        "GoogleフォームURL:",
        formUrl
      );


      setStatus(
        "QRコードを読み取りました。\n\n" +
        decodedText +
        "\n\nGoogleフォームを開きます..."
      );


      /*
       * Googleフォームを開く
       */

      setTimeout(function() {

        window.location.href = formUrl;

      }, 500);

    }


    /*
     * もう一度スキャン
     */

    restartButton.addEventListener(
      "click",
      function() {

        if (html5QrCode) {

          try {
            html5QrCode.clear();
          } catch (e) {
            console.log(e);
          }

        }

        startScanner();

      }
    );


    /*
     * 起動
     */

    startScanner();

  </script>

</body>
</html>
