<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRスキャナ</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 10px;
      background: #f5f5f5;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    button {
      font-size: 18px;
      padding: 10px;
      margin: 10px;
    }
  </style>
</head>

<body>

<h2>QRコード読み取り</h2>

<button onclick="startScan()">スキャン開始</button>
<button onclick="stopScan()">停止</button>

<div id="reader"></div>
<div id="result">待機中</div>

<script>
const GAS_URL = "ここにGASのWebアプリURL";

let html5QrCode;
let isScanning = false;

function startScan() {
  if (isScanning) return;

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
  ).then(() => {
    isScanning = true;
  }).catch(err => {
    document.getElementById("result").innerText = "カメラ起動失敗: " + err;
  });
}

function stopScan() {
  if (!isScanning) return;

  html5QrCode.stop().then(() => {
    isScanning = false;
  });
}

function onScanSuccess(decodedText) {
  document.getElementById("result").innerText = "送信中: " + decodedText;

  fetch(GAS_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ qr: decodedText })
  })
  .then(() => {
    document.getElementById("result").innerText = "記録しました: " + decodedText;
  });
}
</script>

</body>
</html>
